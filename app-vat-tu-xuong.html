.brandrow{display:flex;align-items:center;gap:11px;height:76px;flex:none}

  border-radius:var(--r-sm);color:var(--muted);font-size:15px;font-weight:500;text-align:left;
  transition:background .12s,color .12s}
.navitem:hover{background:var(--sub);color:var(--text)}
.navitem[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.navitem .n{margin-left:auto;font-size:12px;font-weight:600;background:var(--brand);
  color:var(--on-brand);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.navitem[aria-current="page"] .n{background:var(--brand);color:var(--on-brand)}

.usercard{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}
.uname{font-weight:600;color:var(--title);font-size:14.5px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urole{font-size:12.5px;color:var(--faint)}

.content{margin-left:290px;min-width:0}
.topbar{position:sticky;top:0;z-index:50;height:65px;background:var(--card);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.burger{display:none;width:42px;height:42px;border-radius:var(--r-sm);border:1px solid var(--line);

/* ---------- thanh cong cu ---------- */
.search{margin-bottom:16px}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px 14px;min-height:46px;color:var(--text)}
.search input::placeholder{color:var(--faint)}
.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fchip{font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);

.card .nm{font-weight:600;font-size:16px;line-height:1.3;color:var(--title)}

.stock{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;

.stock.low{background:var(--warn-bg);color:var(--warn)}
.stock.out{background:var(--err-bg);color:var(--err)}
.roll{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand)}
.tick{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;
  background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:13px;font-weight:700}

/* ---------- o so luong ---------- */
.qty{display:flex;align-items:center;gap:8px}
.qbtn{width:42px;height:42px;border-radius:var(--r-sm);background:var(--card);
  border:1px solid var(--line);font-size:20px;font-weight:500;line-height:1;
  display:grid;place-items:center;color:var(--text)}
.qbtn:hover{background:var(--sub)}
.qty input{width:70px;height:42px;text-align:center;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-sm);font-weight:600;font-size:16px;
  font-variant-numeric:tabular-nums;color:var(--title)}
.qty .u{font-size:14px;font-weight:500;color:var(--muted)}

/* ---------- nut ---------- */
.btn{font-size:15px;font-weight:600;padding:12px 20px;border-radius:var(--r-sm);
  min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .14s,border-color .14s}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-strong)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}

.btn.ok{background:var(--brand);color:var(--on-brand)}

.linkbtn{background:none;color:var(--muted);font-size:14px;padding:8px;min-height:40px}
.linkbtn:hover{color:var(--err)}

.cartsum .sub{font-size:13.5px;color:var(--faint)}

.acts{display:flex;gap:6px;flex-wrap:wrap}
.pw{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--faint)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:90;

.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--faint);line-height:1.7}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
  .card{padding:14px;min-height:112px}
  .card .nm{font-size:15px}
}

var USERS_HEAD = "# users.txt - moi dong mot tai khoan\n"
               + "# tendangnhap|matkhau|hoten|vaitro|trangthai|ngaytao\n"
               + "# vaitro: admin | kho | ktv     trangthai: active | pending | locked\n";

function acc(hoten){
  var t = String(hoten||"").toLowerCase().split(/\s+/).filter(Boolean);
  if(t.length > 1){
    return t[t.length-1] + t.slice(0,-1).map(function(w){ return w.charAt(0); }).join("");
  }
  return t[0] || "user";
}
function seedUsers(){
  var out = USERS_HEAD + "admin|mmv2026|Qu\u1ea3n tr\u1ecb h\u1ec7 th\u1ed1ng|admin|active|2026-08-28\n";
  PEOPLE0.forEach(function(ten){
    var a = acc(ten);
    out += a + "|" + a + "|" + ten + "|ktv|active|2026-08-28\n";
  });
  return out;
}
function parseUsers(txt){
  var out = [];
  String(txt||"").split(/\r?\n/).forEach(function(line){
    line = line.trim();
    if(!line || line.charAt(0) === "#") return;
    var f = line.split("|");
    if(f.length < 4) return;
    out.push({u:f[0].trim(), p:f[1], ten:(f[2]||f[0]).trim(),
              vt:(f[3]||"ktv").trim(), tt:(f[4]||"active").trim(), ngay:(f[5]||"").trim()});
  });
  return out;
}
function usersToTxt(list){
  return USERS_HEAD + list.map(function(x){
    return [x.u, x.p, x.ten, x.vt, x.tt, x.ngay].join("|");
  }).join("\n") + "\n";
}
function findUser(name){
  var k = String(name||"").trim().toLowerCase();
  for(var i=0;i<USERS.length;i++) if(USERS[i].u.toLowerCase() === k) return USERS[i];
  return null;
}

  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }
function pad(n){ return n<10?"0"+n:""+n; }
function dmy(ts){ var d=new Date(ts); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2); }
function hm(ts){ var d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }

      +   (x.tt==="pending" ? '<button class="mini go" data-act="duyet" data-u="'+esc(x.u)+'">Duyệt</button>' : '')
      +   (x.tt==="active" && !me ? '<button class="mini" data-act="khoa" data-u="'+esc(x.u)+'">Khóa</button>' : '')
      +   (x.tt==="locked" ? '<button class="mini go" data-act="mo" data-u="'+esc(x.u)+'">Mở lại</button>' : '')
      +   '<button class="mini" data-act="matkhau" data-u="'+esc(x.u)+'">Đổi mật khẩu</button>'
      +   (me ? '' : '<button class="mini danger" data-act="xoa" data-u="'+esc(x.u)+'">Xóa</button>')
      + '</div></td></tr>';
  }).join('');

  return ''
  + '<div class="adminbar">'
  +   '<button class="btn ghost" id="adduser">+ Thêm tài khoản</button>'
  +   '<label class="toggle"><input type="checkbox" id="duyet"'+(S.duyet?' checked':'')+'>'
  +     'Tài khoản đăng ký mới phải chờ duyệt</label>'
  +   '<button class="btn ghost" id="dltxt">Tải users.txt</button>'
  + '</div>'
  + '<div class="tablewrap"><table><thead><tr>'
  +   '<th>Họ tên / tài khoản</th><th>Mật khẩu</th><th>Vai trò</th><th>Trạng thái</th>'
  +   '<th>Số dòng</th><th>Thao tác</th>'
  + '</tr></thead><tbody>'+rows+'</tbody></table></div>'
  + '<p class="hint" style="margin-top:14px">Mật khẩu lưu dạng chữ thường trong users.txt, '
  + 'ai mở được app cũng đọc được. Đây là bản dùng thử — bản chính thức trên SharePoint sẽ dùng '
  + 'tài khoản công ty và không lưu mật khẩu ở đây.</p>';
}

/* luu danh sach tai khoan (xuat ban phien ban moi) */
function saveUsers(list, thongBao, duyet){
  var next = {log:S.log, usersTxt:usersToTxt(list),
              duyet:(typeof duyet === "boolean" ? duyet : S.duyet)};
  UI.busy = true;
  useCap("artifact").then(function(a){
    if(!a) throw {code:"not_granted"};
    return a.publish(buildDoc(next));
  }).then(function(){
    try{ if(thongBao) sessionStorage.setItem('mmv.msg', thongBao); }catch(e){}
  }).catch(function(err){
    UI.busy = false;
    var code = (err && err.code) || "upstream_error";
    if(code === "conflict"){
      UI.toast = {msg:"Có người vừa ghi cùng lúc — màn hình đang tải lại, làm lại giúp em.", bad:true};
    }else if(code === "not_granted" || code === "not_writer" || code === "capability_disabled"){
      S.usersTxt = next.usersTxt; S.duyet = next.duyet; USERS = parseUsers(S.usersTxt);
      UI.toast = {msg:"Đã lưu tạm trên máy này (chưa lên máy chủ).", bad:true};
    }else{
      UI.toast = {msg:"Chưa lưu được, thử lại lần nữa.", bad:true};
    }
    render(); fadeToast();
  });
  render();
}

/* ---------- CSV đúng cấu trúc sheet Movement ---------- */
function toCSV(){
  var head = ["ITEMS","SRV","SIV","DATE","CODE","DESCRIPTION","UNIT","RECEIPT","ISSUE","JOB CODE","VESSEL","REMAKS"];
  var lines = [head.join(",")];
  var src = seesAll() ? S.log : S.log.filter(function(r){ return r.user === UI.me.u; });
  src.slice().sort(function(a,b){ return a.ts-b.ts; }).forEach(function(r){
    var row = ["","","",dmy(r.ts),r.code,r.en||r.name,r.mu||r.unit,"",fmt(r.qty),r.job,"","App xuong - "+r.person];
    lines.push(row.map(function(x){
      x = String(x==null?"":x);
      return /[",\n]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x;
    }).join(","));
  });
  return "﻿" + lines.join("\r\n");
}

/* ---------- tự xuất bản phiên bản mới ---------- */
function buildDoc(state){
  var css = document.getElementById('app-style').textContent;
  var js  = document.getElementById('app-script').textContent;
  var data = JSON.stringify(state).replace(/</g,"\\u003c");
  return '<!doctype html>\n<html lang="vi">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>Lấy vật tư xưởng MMV</title>\n' + FONTS + '\n'
    + '<style id="app-style">' + css + '<\/style>\n</head>\n<body>\n'
    + '<div id="root"></div>\n'
    + '<script id="app-state" type="application/json">' + data + '<\/script>\n'
    + '<script id="app-script">' + js + '<\/script>\n</body>\n</html>';
}

function saveBatch(){
  if(UI.busy) return;
  var codes = Object.keys(UI.cart);
  if(!codes.length || !UI.me || !UI.job) return;
  var batch = "B" + Date.now().toString(36);
  var now = Date.now();
  var rows = codes.map(function(c){
    var i = byCode[c];
    return {id:batch+"-"+c, batch:batch, ts:now, user:UI.me.u, person:UI.me.ten, job:UI.job,
            code:c, name:i.v, en:i.e, unit:i.u, mu:(i.mu||i.u), qty:UI.cart[c]};
  });
  var next = {log:S.log.concat(rows), usersTxt:S.usersTxt, duyet:S.duyet};
  UI.busy = true; render();

  try{ sessionStorage.setItem('mmv.pending', JSON.stringify(rows)); }catch(e){}
  try{ localStorage.setItem('mmv.job', UI.job); }catch(e){}

  useCap("artifact").then(function(a){
    if(!a) throw {code:"not_granted"};
    return a.publish(buildDoc(next));
  }).then(function(){
    try{ sessionStorage.setItem('mmv.saved', String(rows.length)); }catch(e){}
    /* trang sẽ tự tải lại sang phiên bản mới */
  }).catch(function(err){
    UI.busy = false;
    var code = (err && err.code) || "upstream_error";
    if(code==="conflict"){
      UI.toast = {msg:"Có người vừa ghi cùng lúc — màn hình đang tải lại, bấm lại giúp em.", bad:true};
    }else if(code==="not_granted" || code==="not_writer" || code==="capability_disabled"){
      /* không ghi lên máy chủ được: giữ tạm trên máy này */
      S.log = next.log;
      try{ localStorage.setItem('mmv.offline', JSON.stringify(S.log)); }catch(e){}
      UI.cart = {}; UI.sheet = false;
      UI.toast = {msg:"Đã ghi tạm trên máy này (chưa lên máy chủ). Báo nhân viên kho xuất file.", bad:true};
    }else{
      UI.toast = {msg:"Chưa ghi được, thử lại lần nữa.", bad:true};
    }
    render(); fadeToast();
  });
}

function fadeToast(){ setTimeout(function(){ if(UI.toast){ UI.toast=null; render(); } }, 4200); }

/* ---------- dang nhap / dang ky ---------- */
function doAuth(){
  var g = function(id){ var e = document.getElementById(id); return e ? e.value : ""; };
  var u = g('au').trim(), mk = g('ap');
  UI.authU = u; UI.authErr = ""; UI.authOk = "";

  if(UI.auth === "register"){
    var ten = g('aten').trim(), mk2 = g('ap2');
    UI.authTen = ten;
    if(u.length < 3){ UI.authErr = "Tên đăng nhập phải từ 3 ký tự."; return render(); }
    if(/\s/.test(u) || u.indexOf("|") >= 0){ UI.authErr = "Tên đăng nhập không được có dấu cách hoặc ký tự |"; return render(); }
    if(!ten){ UI.authErr = "Chưa nhập họ và tên."; return render(); }
    if(ten.indexOf("|") >= 0){ UI.authErr = "Họ tên không được có ký tự |"; return render(); }
    if(mk.length < 4){ UI.authErr = "Mật khẩu phải từ 4 ký tự."; return render(); }
    if(mk !== mk2){ UI.authErr = "Hai lần nhập mật khẩu không giống nhau."; return render(); }
    if(findUser(u)){ UI.authErr = "Tên đăng nhập này đã có người dùng."; return render(); }
    var tt = S.duyet ? "pending" : "active";
    var list = USERS.concat([{u:u, p:mk, ten:ten, vt:"ktv", tt:tt, ngay:today()}]);
    if(tt === "active"){ try{ localStorage.setItem('mmv.session', u); }catch(e){} }
    saveUsers(list, tt === "active" ? ("Chào " + ten + ", tài khoản đã tạo xong.")
                                    : "Đã gửi đăng ký. Chờ quản trị duyệt rồi đăng nhập lại.");
    return;
  }

  var x = findUser(u);
  if(!x || x.p !== mk){ UI.authErr = "Sai tên đăng nhập hoặc mật khẩu."; return render(); }
  if(x.tt === "pending"){ UI.authErr = "Tài khoản đang chờ quản trị duyệt."; return render(); }
  if(x.tt === "locked"){ UI.authErr = "Tài khoản đã bị khóa. Liên hệ quản trị."; return render(); }
  try{ localStorage.setItem('mmv.session', x.u); }catch(e){}
  UI.me = x; UI.tab = "take"; UI.authErr = ""; UI.authU = "";
  render();
}

/* ---------- sự kiện ---------- */
function wire(){
  var root = document.getElementById('root');

  root.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ UI.tab = b.dataset.tab; UI.drawer = false; render(); };
  });
  var bg = document.getElementById('burger');
  if(bg) bg.onclick = function(){ UI.drawer = !UI.drawer; render(); };
  var ds = document.getElementById('drawerscrim');
  if(ds) ds.onclick = function(){ UI.drawer = false; render(); };
  root.querySelectorAll('[data-filter]').forEach(function(b){
    b.onclick = function(){ UI.filter = b.dataset.filter; render(); };
  });

  /* --- dang nhap / dang ky --- */
  document.querySelectorAll('[data-auth]').forEach(function(b){
    b.onclick = function(){
      var au = document.getElementById('au');
      UI.authU = au ? au.value : "";
      UI.auth = b.dataset.auth; UI.authErr = ""; UI.authOk = "";
      render();
    };
  });
  var ago = document.getElementById('ago');
  if(ago) ago.onclick = doAuth;
  ['au','aten','ap','ap2'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onkeydown = function(ev){ if(ev.key === "Enter") doAuth(); };
  });
  var lo = document.getElementById('logout');
  if(lo) lo.onclick = function(){
    try{ localStorage.removeItem('mmv.session'); }catch(e){}
    UI.me = null; UI.cart = {}; UI.tab = "take"; UI.auth = "login";
    UI.authU = ""; UI.authErr = ""; UI.authOk = "";
    render();
  };

  /* --- quan tri --- */
  var au2 = document.getElementById('adduser');
  if(au2) au2.onclick = function(){
    var ten = prompt("Họ và tên:");
    if(!ten || !ten.trim()) return;
    var u = prompt("Tên đăng nhập:", acc(ten));
    if(!u || !u.trim()) return;
    u = u.trim();
    if(u.indexOf("|") >= 0 || /\s/.test(u)){ alert("Tên đăng nhập không được có dấu cách hoặc ký tự |"); return; }
    if(findUser(u)){ alert("Tên đăng nhập này đã có người dùng."); return; }
    var mk = prompt("Mật khẩu:", "123456");
    if(!mk) return;
    var list = USERS.concat([{u:u, p:mk, ten:ten.trim(), vt:"ktv", tt:"active", ngay:today()}]);
    saveUsers(list, "Đã thêm tài khoản " + u);
  };
  var dz = document.getElementById('duyet');
  if(dz) dz.onchange = function(){ saveUsers(USERS, "", dz.checked); };
  var dl = document.getElementById('dltxt');
  if(dl) dl.onclick = function(){
    useCap("downloads").then(function(d){
      if(!d) throw {code:"unavailable"};
      return d.save({filename:"users.txt", data:S.usersTxt});
    }).then(function(){
      UI.toast = {msg:"Đã tải users.txt"}; render(); fadeToast();
    }).catch(function(e){
      if(e && e.code === "declined") return;
      UI.toast = {msg:"Không tải được file.", bad:true}; render(); fadeToast();
    });
  };
  document.querySelectorAll('[data-vt]').forEach(function(sel){
    sel.onchange = function(){
      var list = USERS.map(function(x){
        return x.u === sel.dataset.vt ? {u:x.u,p:x.p,ten:x.ten,vt:sel.value,tt:x.tt,ngay:x.ngay} : x; });
      saveUsers(list, "Đã đổi vai trò " + sel.dataset.vt);
    };
  });
  document.querySelectorAll('[data-act]').forEach(function(b){
    b.onclick = function(){
      var u = b.dataset.u, act = b.dataset.act, x = findUser(u);
      if(!x) return;
      var list;
      if(act === "xoa"){
        if(!confirm("Xóa tài khoản " + u + "? Các dòng đã ghi vẫn giữ nguyên.")) return;
        list = USERS.filter(function(y){ return y.u !== u; });
        saveUsers(list, "Đã xóa tài khoản " + u);
        return;
      }
      if(act === "matkhau"){
        var mk = prompt("Mật khẩu mới cho " + u + ":");
        if(!mk) return;
        list = USERS.map(function(y){
          return y.u === u ? {u:y.u,p:mk,ten:y.ten,vt:y.vt,tt:y.tt,ngay:y.ngay} : y; });
        saveUsers(list, "Đã đổi mật khẩu " + u);
        return;
      }
      var tt = act === "khoa" ? "locked" : "active";
      list = USERS.map(function(y){
        return y.u === u ? {u:y.u,p:y.p,ten:y.ten,vt:y.vt,tt:tt,ngay:y.ngay} : y; });
      saveUsers(list, act === "khoa" ? ("Đã khóa " + u) : ("Đã mở lại " + u));
    };
  });

  var q = document.getElementById('q');
  if(q) q.oninput = function(){
    UI.q = q.value;
    var pos = q.selectionStart;
    render();
    var q2 = document.getElementById('q');
    if(q2){ q2.focus(); try{ q2.setSelectionRange(pos,pos); }catch(e){} }
  };

  root.querySelectorAll('[data-pick]').forEach(function(b){
    b.onclick = function(){
      var c = b.dataset.pick;
      if(UI.cart[c] != null) delete UI.cart[c]; else UI.cart[c] = 1;
      render();
    };
  });
  root.querySelectorAll('.qty').forEach(function(row){
    var c = row.dataset.code, it = byCode[c], step = it.dec ? 0.5 : 1;
    row.querySelectorAll('[data-step]').forEach(function(b){
      b.onclick = function(ev){
        ev.stopPropagation();
        var n = UI.cart[c] + step*Number(b.dataset.step);
        UI.cart[c] = Math.max(step, Math.round(n*10)/10);
        render();
      };
    });
    var inp = row.querySelector('[data-qty]');
    inp.onclick = function(ev){ ev.stopPropagation(); };
    inp.onchange = function(){
      var n = parseFloat(String(inp.value).replace(",","."));
      UI.cart[c] = (isNaN(n)||n<=0) ? step : Math.round(n*10)/10;
      render();
    };
  });

  var cl = document.getElementById('clear');
  if(cl) cl.onclick = function(){ UI.cart = {}; render(); };
  var nx = document.getElementById('next');
  if(nx) nx.onclick = function(){ UI.sheet = true; render(); };

  var close = document.getElementById('close');
  if(close) close.onclick = function(){ UI.sheet = false; render(); };
  var scrim = document.getElementById('scrim');
  if(scrim) scrim.onclick = function(ev){ if(ev.target === scrim){ UI.sheet = false; render(); } };
  var job = document.getElementById('job');
  if(job) job.onchange = function(){ UI.job = job.value; render(); };
  var jf = document.getElementById('jobfree');
  if(jf) jf.onchange = function(){ UI.job = jf.value.trim().toUpperCase(); render(); };
  document.querySelectorAll('[data-drop]').forEach(function(b){
    b.onclick = function(){
      delete UI.cart[b.dataset.drop];
      if(!Object.keys(UI.cart).length) UI.sheet = false;
      render();
    };
  });
  var sv = document.getElementById('save');
  if(sv) sv.onclick = saveBatch;

  var csv = document.getElementById('csv');
  if(csv) csv.onclick = function(){
    var name = "movement-app-xuong-" + new Date().toISOString().slice(0,10);
    useCap("downloads").then(function(d){
      if(!d) throw {code:"unavailable"};
      return d.save({filename:name+".csv", data:toCSV()}).catch(function(e){
        if(e && e.code==="extension_not_enabled") return d.save({filename:name+".txt", data:toCSV()});
        throw e;
      });
    }).then(function(){
      UI.toast = {msg:"Đã tải file. Mở bằng Excel rồi dán vào sheet Movement."}; render(); fadeToast();
    }).catch(function(e){
      if(e && e.code==="declined") return;
      UI.toast = {msg:"Không tải được file — dùng nút Chép vào clipboard.", bad:true}; render(); fadeToast();
    });
  };
  var cp = document.getElementById('copy');
  if(cp) cp.onclick = function(){
    var txt = toCSV().replace(/^﻿/,"").split("\r\n").map(function(l){
      return l.split(",").join("\t"); }).join("\n");
    navigator.clipboard.writeText(txt).then(function(){
      UI.toast = {msg:"Đã chép. Dán thẳng vào sheet Movement."}; render(); fadeToast();
    }).catch(function(){
      UI.toast = {msg:"Trình duyệt không cho chép — dùng nút tải file.", bad:true}; render(); fadeToast();
    });
  };
}

/* ---------- khởi động ---------- */
(function boot(){
  /* gộp phần ghi tạm khi máy chủ không nhận */
  try{
    var off = JSON.parse(localStorage.getItem('mmv.offline') || "[]");
    if(off.length){
      var have = {}; S.log.forEach(function(r){ have[r.id]=1; });
      var add = off.filter(function(r){ return !have[r.id]; });
      if(add.length) S.log = S.log.concat(add);
      else localStorage.removeItem('mmv.offline');
    }
  }catch(e){}

  render();

  try{
    var msg = sessionStorage.getItem('mmv.msg');
    if(msg){
      sessionStorage.removeItem('mmv.msg');
      UI.toast = {msg:msg}; render(); fadeToast();
    }
    var n = sessionStorage.getItem('mmv.saved');
    if(n){
      sessionStorage.removeItem('mmv.saved');
      sessionStorage.removeItem('mmv.pending');
      try{ localStorage.removeItem('mmv.offline'); }catch(e){}
      UI.toast = {msg:"Đã ghi xong " + n + " món. Cảm ơn!"};
      render(); fadeToast();
    }
  }catch(e){}
})();
</script>
